aid: star-therapeutics
name: Star Therapeutics
description: >-
  Star Therapeutics is a clinical-stage biotechnology company headquartered at 201 Haskins Way in
  South San Francisco, California, that transforms the lives of patients with serious diseases by
  discovering and developing best-in-class antibody therapies, with an initial focus on hematology
  and immunology. It operates a hub-and-spoke model, building a family of companies that each pursue
  a distinct area of novel biology, and it develops each programme under a pipeline-in-a-product
  strategy in which a single antibody is advanced across multiple related indications rather than one.
  The company emerged from stealth in February 2022 having raised $100 million since inception,
  added a $90 million round in September 2023, and closed an oversubscribed $125 million Series D in
  September 2025 to move its lead asset into a registrational programme. Its two named spokes are
  Vega Therapeutics, whose VGA039 is a first-in-class monoclonal antibody against Protein S developed
  as a subcutaneous therapy for von Willebrand disease and other bleeding disorders, and Electra
  Therapeutics, which targets SIRP proteins with ELA-026 in secondary hemophagocytic
  lymphohistiocytosis. VGA039 has received FDA Orphan Drug, Fast Track, Rare Pediatric Disease and
  Breakthrough Therapy designations; Incyte completed its acquisition of Vega Therapeutics, a wholly
  owned subsidiary of Star Therapeutics, in July 2026. Star Therapeutics runs no developer program
  and publishes no product API, developer portal, or API documentation. The only machine-readable
  surface reachable without credentials is the WordPress REST content API behind
  star-therapeutics.com, catalogued here.
