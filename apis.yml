apis:
- aid: star-therapeutics:star-therapeutics-content-api
  name: Star Therapeutics Content API
  description: >-
    The anonymously readable WordPress REST API behind star-therapeutics.com. It exposes the 28
    published news items — press releases, news coverage and scientific presentations spanning the
    company's 2022 emergence from stealth through the 2026 Incyte acquisition of Vega Therapeutics —
    the 11 published corporate pages (Homepage, Our Approach, Leadership, News, Careers, Share Your
    Story, Consumer Health US, Social Landing Page, Members, Privacy Policy, Terms of Use), the
    661-item media library, the five news categories, the registered post types, taxonomies and
    statuses, cross-content search, and the oEmbed 1.0 provider endpoint. This is not a developer
    product Star Therapeutics markets; it is the site's own content surface, registered at /wp-json/
    and verified to return data without credentials. The OpenAPI in this repo is derived from the
    published route index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://star-therapeutics.com/wp-json
  tags:
  - content
  - wordpress
  - corporate
  - news
  - media
  properties:
