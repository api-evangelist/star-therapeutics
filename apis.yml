    url: data-model/star-therapeutics-data-model.yml
  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://star-therapeutics.com/wp-json/ — 491 routes across 31 namespaces including
    oembed/1.0, wp/v2, wp-site-health/v1, wp-block-editor/v1, wp-abilities/v1, jet-engine/v1,
    jet-engine/v2, elementor/v1, elementor-pro/v1, elementskit/v1, yoast/v1, redirection/v1,
    wordfence/v1, gravityview/import/v1, gravitykit/v1, gwiz/v1, genesisblocks/v1, ai1wm/v1,
    cookieyes/v1, cky/v1, croco/v1, wpe/cache-plugin/v1 and wpe_sign_on_plugin/v1 — and verified
    against live anonymous responses on 2026-08-05. Only operations that returned data without
    credentials are modelled; every write route and the entire plugin-administration surface is
    excluded. Anonymous 401s recorded at harvest: /wp/v2/users (rest_user_cannot_view),
    /wp/v2/settings, /wp/v2/menus, /wp/v2/themes, /wp/v2/plugins, /wp/v2/block-types,
    /wp/v2/font-collections and /wp/v2/icons. Notably the site registers TWO agent-facing capability
    registries — the WordPress Abilities API (wp-abilities/v1) and a JetEngine MCP server
    (jet-engine/v1/mcp, jet-engine/v1/mcp-tools) — but a JSON-RPC tools/list POST to
    /wp-json/jet-engine/v1/mcp returned 401 rest_forbidden and every wp-abilities/v1 route returned
    401, so no MCP or agent surface is claimed for this provider and no MCPServer pointer is
    emitted. The site is served by WP Engine behind Cloudflare and sets x-robots-tag: noindex on API
    responses. Star Therapeutics publishes no developer documentation, no API reference, no
    getting-started guide and no support channel for this surface, so no Documentation /
    APIReference / GettingStarted pointers are emitted; the humanURL above is the upstream WordPress
    REST handbook that defines the wp/v2 contract.
