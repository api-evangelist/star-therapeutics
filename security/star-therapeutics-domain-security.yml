observations:
- >-
  DMARC aggregate reporting is misconfigured. The published record is
  "v=DMARC1; p=none; rua=mailto:admin@star-therapeutisc.com; ruf=mailto:admin@star-therapeutics.com"
  — the rua (aggregate report) address is a transposed-letter typo of the company's own domain,
  "star-therapeutisc.com", which has no nameservers and does not resolve. Aggregate DMARC reports
  are therefore being sent to a non-existent domain and are silently lost, while the ruf (forensic)
  address is spelled correctly. Combined with p=none this means the domain has neither enforcement
  nor working visibility.
