regulatory_context:
  note: >-
    Star Therapeutics is a clinical-stage biopharmaceutical company. It is subject to FDA
    regulation of its investigational products — VGA039 carries Orphan Drug, Fast Track, Rare
    Pediatric Disease and Breakthrough Therapy designations — but that is drug-development
    regulation, not API or data-processing regulation, and it confers nothing on the public content
    API catalogued here. The site publishes a Privacy Policy, Terms of Use and a Consumer Health US
    notice; none of them describe an API, a data-processing agreement or a compliance certification.
    No HIPAA, GDPR, SOC 2 or ISO 27001 claim is published anywhere on the public surface, and none
    is asserted on the company's behalf.
